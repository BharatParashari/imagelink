# Rate-limit zones (http context; conf.d/*.conf is included inside http{}).
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=12r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10M;

    # ---- Frontend ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy         "no-referrer" always;
    }

    # ---- Uploaded images (public, so links are shareable) ----
    location /uploads/ {
        alias /uploads/;
        types {
            image/jpeg  jpg jpeg;
            image/png   png;
            image/gif   gif;
            image/webp  webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Login: tighter rate limit to slow brute-force ----
    location = /api/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Other API routes ----
    location /api/ {
        limit_req zone=api_limit burst=8 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
