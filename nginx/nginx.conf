# Rate-limit zone. This sits in the http{} context — conf.d/*.conf files are
# included inside http{}, so defining it here (outside server{}) is valid.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=12r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10M;

    # ---- Frontend ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy         "no-referrer" always;
    }

    # ---- Uploaded images ----
    # Serve ONLY as images. Anything whose extension isn't an image type below
    # falls through to octet-stream and downloads instead of rendering, so a
    # stray .html/.svg can never execute in the browser as same-origin content.
    location /uploads/ {
        alias /uploads/;

        types {
            image/jpeg  jpg jpeg;
            image/png   png;
            image/gif   gif;
            image/webp  webp;
        }
        default_type application/octet-stream;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- API -> Node backend (rate limited) ----
    location /api/ {
        limit_req zone=api_limit burst=8 nodelay;

        proxy_pass http://backend:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # ---- When you move to a subdomain, add real access control here ----
    # 1) Generate credentials (run once on the host):
    #      docker run --rm httpd:alpine htpasswd -nb youruser yourpassword > nginx/.htpasswd
    #    and mount nginx/.htpasswd into the container at /etc/nginx/.htpasswd
    # 2) Then uncomment these two lines inside BOTH "location /" and "location /api/":
    #      auth_basic           "ImageLink";
    #      auth_basic_user_file /etc/nginx/.htpasswd;
}
